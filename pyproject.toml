[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inventree-mcp"
version = "1.1.0"
description = "MCP server for InvenTree inventory management"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "inventree", "inventory", "llm", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=3.4.7",
    "httpx>=0.27.0",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.4",
]

[project.urls]
Homepage = "https://github.com/munin92/inventree-mcp"
Repository = "https://github.com/munin92/inventree-mcp"
Issues = "https://github.com/munin92/inventree-mcp/issues"

[project.scripts]
inventree-mcp = "inventree_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# smoke_test.py in the repository root talks to a live InvenTree instance and
# fails at collection time without one. Scoping pytest to tests/ keeps a plain
# `pytest` working for contributors and in CI.
testpaths = ["tests"]

[tool.hatch.version]
path = "inventree_mcp/__init__.py"
